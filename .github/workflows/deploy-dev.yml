name: Deploy DEV API

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DEV server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            source $NVM_DIR/nvm.sh

            nvm use 20

            cd ~/apps/api-thandoso-dev/api-than-do-so

            git fetch origin
            git checkout dev
            git pull origin dev

            npm ci
            npm run build

            npx pm2 reload ecosystem.dev.config.json --env development
